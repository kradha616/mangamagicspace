<!DOCTYPE html>
<html>
<head>
<title>MangaMagicSpace</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="navbar">
    <div class="logo"><a href="index.html">MangaMagicSpace</a></div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="upload.html">Upload</a>

        <a href="history.html" id="historyLink">History</a>

        <a href="login.html" id="loginLink">Login</a>
        <a href="signup.html" id="signupLink">Sign Up</a>

        <a href="#" id="logoutBtn" style="display:none;">Logout</a>
        <button id="themeToggle">🌙</button>
    </div>
</div>

<!-- Slider -->
<div class="slider">
    <a id="sliderLink" href="reader.html?manga=naruto&chapter=chapter-1">
        <img id="sliderImage" src="manga/slider/naruto-banner.jpg">
    </a>
</div>

<div class="hero">
    <h1>Read. Upload. Explore Manga.</h1>
    <p>Your ultimate manga reading experience.</p>
</div>

<div class="manga-grid">

<div class="manga-card">
<a href="reader.html?manga=naruto&chapter=chapter-1">
<div class="image-container">
<img src="manga/naruto/cover.jpeg">
<div class="overlay"></div>
<div class="title">Naruto</div>
</div>
</a>
</div>

<div class="manga-card">
<a href="reader.html?manga=one-piece&chapter=chapter-1">
<div class="image-container">
<img src="manga/one-piece/cover.jpeg/cover.jpeg">
<div class="overlay"></div>
<div class="title">One Piece</div>
</div>
</a>
</div>

<div class="manga-card">
<a href="reader.html?manga=attack-on-titan&chapter=chapter-1">
<div class="image-container">
<img src="manga/attack-on-titan/cover.jpeg">
<div class="overlay"></div>
<div class="title">Attack on Titan</div>
</div>
</a>
</div>

<div class="manga-card">
<a href="reader.html?manga=jujutsu-kaisen&chapter=chapter-1">
<div class="image-container">
<img src="manga/jujutsu-kaisen/chapter-1/1.jpeg">
<div class="overlay"></div>
<div class="title">Jujutsu Kaisen</div>
</div>
</a>
</div>

</div>

<script>
const user = localStorage.getItem("loggedInUser");

if(user){
    document.getElementById("loginLink").style.display = "none";
    document.getElementById("signupLink").style.display = "none";
    document.getElementById("logoutBtn").style.display = "inline";
}else{
    document.getElementById("historyLink").style.display = "none";
}

document.getElementById("logoutBtn").onclick = function(){
    localStorage.removeItem("loggedInUser");
    location.reload();
};

// Slider

const slides = [
{
    image: "manga/slider/naruto-banner.jpg",
    link: "reader.html?manga=naruto&chapter=chapter-1"
},
{
    image: "manga/slider/onepiece-banner.jpg",
    link: "reader.html?manga=one-piece&chapter=chapter-1"
},
{
    image: "manga/slider/aot-banner.jpg",
    link: "reader.html?manga=attack-on-titan&chapter=chapter-1"
},
{
    image: "manga/slider/jjk-banner.jpg",
    link: "reader.html?manga=jujutsu-kaisen&chapter=chapter-1"
}
];

let i = 0;

const sliderImage = document.getElementById("sliderImage");
const sliderLink = document.getElementById("sliderLink");

setInterval(function () {
    i++;
    if (i >= slides.length) {
        i = 0;
    }

    sliderImage.src = slides[i].image;
    sliderLink.href = slides[i].link;

}, 3000);
</script>

</body>
</html>
